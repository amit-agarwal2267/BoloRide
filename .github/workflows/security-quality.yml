name: Security and Quality

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: security-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  approval:
    name: Owner approval gate
    runs-on: ubuntu-latest
    environment: ci-approval
    timeout-minutes: 360
    steps:
      - name: CI authorized
        run: echo "Security and quality checks authorized."

  hygiene:
    name: Repository hygiene
    needs: approval
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Reject tracked environment and key files
        shell: bash
        run: |
          set -euo pipefail
          bad_env_files="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$' || true)"
          if [[ -n "${bad_env_files}" ]]; then
            echo "Tracked environment files are not allowed:"
            echo "${bad_env_files}"
            exit 1
          fi
          bad_key_files="$(git ls-files | grep -Ei '\.(pem|key|p12|pfx|jks|keystore)$' || true)"
          if [[ -n "${bad_key_files}" ]]; then
            echo "Potential private-key or keystore files are tracked:"
            echo "${bad_key_files}"
            exit 1
          fi

      - name: Reject merge-conflict markers
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE '^(<<<<<<< |>>>>>>> )' -- .; then
            echo "Merge-conflict markers found."
            exit 1
          fi

      - name: Reject unexpectedly large files
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' file; do
            [[ -f "${file}" ]] || continue
            size=$(stat -c '%s' "${file}")
            if (( size > 5242880 )); then
              echo "Tracked file exceeds 5 MiB: ${file} (${size} bytes)"
              found=1
            fi
          done < <(git ls-files -z)
          exit "${found}"

      - name: Check whitespace errors
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          else
            git diff --check HEAD^..HEAD
          fi

  gitleaks:
    name: Secret scan (Gitleaks)
    needs: approval
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  trufflehog:
    name: Secret scan (TruffleHog)
    needs: approval
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Scan repository
        uses: trufflesecurity/trufflehog@466da5b0bb161144f6afca9afe5d57975828c410
        with:
          path: ./
          version: "3.90.8"

  python-quality:
    name: Python quality
    needs: approval
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.12.7"
          enable-cache: true

      - name: Lint and format changed Python files
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            mapfile -t files < <(git diff --name-only --diff-filter=ACMR "${base}...${head}" -- '*.py')
          else
            mapfile -t files < <(git ls-files '*.py')
          fi

          if (( ${#files[@]} == 0 )); then
            echo "No Python files to check."
            exit 0
          fi

          printf 'Checking %s\n' "${files[@]}"
          uvx ruff check "${files[@]}"
          uvx ruff format --check "${files[@]}"

  dependencies:
    name: Dependency audit
    needs: approval
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.12.7"
          enable-cache: true

      - name: Audit Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv export --frozen --no-dev --no-emit-project --no-hashes --format requirements-txt --output-file /tmp/requirements.txt
          uvx pip-audit --requirement /tmp/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Audit web dependencies
        working-directory: web
        run: npm audit --audit-level=high

  web-build:
    name: Web production build
    needs: approval
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Run web unit tests
        working-directory: web
        run: npm test

      - name: Run TypeScript typecheck
        working-directory: web
        run: npm run typecheck

      - name: Production build
        working-directory: web
        env:
          BOLORIDE_API_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_SUPABASE_URL: https://example.invalid
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
        run: npm run build

  codeql:
    name: CodeQL (${{ matrix.language }})
    needs: approval
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - javascript-typescript
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52
        with:
          category: "/language:${{ matrix.language }}"

  test:
    name: test
    needs:
      - hygiene
      - gitleaks
      - trufflehog
      - python-quality
      - dependencies
      - web-build
      - codeql
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Create CI environment
        shell: bash
        run: |
          cat > .env <<'EOF'
          APP_ENV=test
          APP_PORT=8000
          POSTGRES_DB=boloride
          POSTGRES_USER=boloride
          POSTGRES_PASSWORD=ci-only-postgres-password
          DATABASE_URL=postgresql+asyncpg://boloride:ci-only-postgres-password@postgres:5432/boloride
          LANGFUSE_ENABLED=false
          LIVEKIT_URL=ws://livekit-server:7880
          LIVEKIT_API_KEY=ci-only-livekit-key
          LIVEKIT_API_SECRET=ci-only-livekit-secret-not-a-real-credential
          LLM_PRIMARY_PROVIDER=google
          LLM_PRIMARY_MODEL=ci-only-google-primary-model
          LLM_FALLBACK_1_PROVIDER=google
          LLM_FALLBACK_1_MODEL=ci-only-google-fallback-model
          LLM_FALLBACK_2_PROVIDER=groq
          LLM_FALLBACK_2_MODEL=ci-only-groq-fallback-model
          GOOGLE_API_KEY=ci-only-google-api-key-not-a-secret
          GROQ_API_KEY=ci-only-groq-api-key-not-a-secret
          EOF

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build and start Docker Compose services
        run: docker compose up -d --build

      - name: Wait for application readiness
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://localhost:8000/health/ready; then
              ready=true
              break
            fi
            echo "Waiting for BoloRide readiness (${attempt}/60)..."
            sleep 2
          done
          if [[ "${ready}" != "true" ]]; then
            echo "BoloRide did not become ready within 120 seconds."
            exit 1
          fi

      - name: Require exactly one Alembic head
        shell: bash
        run: |
          set -euo pipefail
          heads="$(docker compose exec -T boloride uv run alembic heads)"
          echo "${heads}"
          count="$(printf '%s\n' "${heads}" | grep -c '(head)' || true)"
          if [[ "${count}" -ne 1 ]]; then
            echo "Expected exactly one Alembic head, found ${count}."
            exit 1
          fi

      - name: Run database migrations
        run: docker compose exec -T boloride uv run alembic upgrade head

      - name: Run full Python test suite
        run: docker compose exec -T boloride uv run pytest

      - name: Print Docker diagnostics
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Clean up Docker Compose resources
        if: always()
        run: docker compose down --volumes --remove-orphans
