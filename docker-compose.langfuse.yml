services:

  # ==========================================================
  # Langfuse Web
  # ==========================================================

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4

    container_name: boloride-langfuse-web

    restart: unless-stopped

    depends_on:
      langfuse-postgres:
        condition: service_healthy

      langfuse-clickhouse:
        condition: service_healthy

      langfuse-redis:
        condition: service_healthy

      langfuse-minio:
        condition: service_healthy

      langfuse-minio-init:
        condition: service_completed_successfully

    ports:
      - "3000:3000"

    environment:
      NEXTAUTH_URL: http://localhost:3000

      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}

      DATABASE_URL: postgresql://${LANGFUSE_POSTGRES_USER}:${LANGFUSE_POSTGRES_PASSWORD}@langfuse-postgres:5432/${LANGFUSE_POSTGRES_DB}

      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_USER: ${LANGFUSE_CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${LANGFUSE_CLICKHOUSE_DB}
      CLICKHOUSE_CLUSTER_ENABLED: "false"

      REDIS_HOST: langfuse-redis
      REDIS_PORT: 6379
      REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD}

      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_MINIO_ACCESS_KEY}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_SECRET_KEY}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"

      TELEMETRY_ENABLED: "false"

      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:-}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:-}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-}

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/public/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

    networks:
      - boloride-network


  # ==========================================================
  # Langfuse Worker
  # ==========================================================

  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4

    container_name: boloride-langfuse-worker

    restart: unless-stopped

    depends_on:
      langfuse-postgres:
        condition: service_healthy

      langfuse-clickhouse:
        condition: service_healthy

      langfuse-redis:
        condition: service_healthy

      langfuse-minio:
        condition: service_healthy

      langfuse-minio-init:
        condition: service_completed_successfully

    environment:
      NEXTAUTH_URL: http://langfuse-web:3000

      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}

      DATABASE_URL: postgresql://${LANGFUSE_POSTGRES_USER}:${LANGFUSE_POSTGRES_PASSWORD}@langfuse-postgres:5432/${LANGFUSE_POSTGRES_DB}

      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_USER: ${LANGFUSE_CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${LANGFUSE_CLICKHOUSE_DB}
      CLICKHOUSE_CLUSTER_ENABLED: "false"

      REDIS_HOST: langfuse-redis
      REDIS_PORT: 6379
      REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD}

      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_MINIO_ACCESS_KEY}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_SECRET_KEY}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"

      TELEMETRY_ENABLED: "false"

    networks:
      - boloride-network


  # ==========================================================
  # Langfuse PostgreSQL
  # ==========================================================

  langfuse-postgres:
    image: postgres:17-alpine

    container_name: boloride-langfuse-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${LANGFUSE_POSTGRES_DB}
      POSTGRES_USER: ${LANGFUSE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD}

    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${LANGFUSE_POSTGRES_USER} -d ${LANGFUSE_POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - boloride-network


  # ==========================================================
  # ClickHouse
  # ==========================================================

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:26.4

    container_name: boloride-langfuse-clickhouse

    restart: unless-stopped

    environment:
      CLICKHOUSE_DB: ${LANGFUSE_CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${LANGFUSE_CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1

    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8123/ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - boloride-network


  # ==========================================================
  # Redis
  # ==========================================================

  langfuse-redis:
    image: redis:7-alpine

    container_name: boloride-langfuse-redis

    restart: unless-stopped

    command:
      [
        "redis-server",
        "--requirepass",
        "${LANGFUSE_REDIS_PASSWORD}"
      ]

    volumes:
      - langfuse_redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${LANGFUSE_REDIS_PASSWORD}",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - boloride-network


  # ==========================================================
  # MinIO
  # ==========================================================

  langfuse-minio:
    image: minio/minio:latest

    container_name: boloride-langfuse-minio

    restart: unless-stopped

    environment:
      MINIO_ROOT_USER: ${LANGFUSE_MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_SECRET_KEY}

    command: server /data --console-address ":9001"

    volumes:
      - langfuse_minio_data:/data

    ports:
      - "127.0.0.1:9090:9001"

    healthcheck:
      test:
        [
          "CMD",
          "mc",
          "ready",
          "local"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - boloride-network

  langfuse-minio-init:
    image: minio/mc:latest
    depends_on:
      langfuse-minio:
        condition: service_healthy
    environment:
      LANGFUSE_MINIO_ACCESS_KEY: ${LANGFUSE_MINIO_ACCESS_KEY}
      LANGFUSE_MINIO_SECRET_KEY: ${LANGFUSE_MINIO_SECRET_KEY}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://langfuse-minio:9000 "$${LANGFUSE_MINIO_ACCESS_KEY}" "$${LANGFUSE_MINIO_SECRET_KEY}"
        && mc mb --ignore-existing local/langfuse
    restart: "no"
    networks:
      - boloride-network


volumes:
  langfuse_postgres_data:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_redis_data:
  langfuse_minio_data:


networks:
  boloride-network:
    external: true
    name: boloride-network
